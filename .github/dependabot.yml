version: 2
updates:
  - package-ecosystem: npm
    directory: /src/main/webui
    schedule:
      interval: cron
      cronjob: "0 6 * * 1,3,5"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore(web)
    groups:
      svelte:
        patterns:
          - svelte
          - svelte-check
          - "@sveltejs/*"
          - prettier-plugin-svelte
          - vite
      patch:
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * 1,3,5"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore(deps)
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      quarkus:
        patterns:
          - "io.quarkus*"
      patch:
        patterns:
          - "*"
        update-types:
          - patch
