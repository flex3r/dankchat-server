quarkus.application.name=dankchat-server
quarkus.http.port=8080

quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=flex3r
quarkus.container-image.name=dankchat-server
quarkus.container-image.labels."org.opencontainers.image.source"=https://github.com/flex3r/dankchat-server

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.kotlin-serialization.json.ignore-unknown-keys=true

dankchat.badges.image-base-url=https://api.dank.chat/badges
%dev.dankchat.badges.image-base-url=http://localhost:8080/badges
dankchat.admin.twitch-ids=73697410

quarkus.oidc.provider=twitch
quarkus.oidc.client-id=${TWITCH_CLIENT_ID:}
quarkus.oidc.credentials.client-secret.value=${TWITCH_CLIENT_SECRET:}
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.authentication.redirect-path=/login/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.authentication.extra-params.claims={"id_token":{"preferred_username":null}}
quarkus.oidc.authentication.session-age-extension=30D
quarkus.oidc.authentication.id-token-required=false
quarkus.oidc.authentication.user-info-required=false
quarkus.oidc.token.refresh-expired=true
# Refreshed sessions get an internal ID token signed with the client secret, Twitch secrets are shorter than HS256 asks for
smallrye.jwt.sign.relax-key-validation=true
%prod.quarkus.oidc.authentication.cookie-force-secure=true
%dev.quarkus.oidc.authentication.force-redirect-https-scheme=false
%test.quarkus.oidc.tenant-enabled=false

quarkus.quinoa.build-dir=build
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/v1,/badges,/login,/logout
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.22.0
quarkus.quinoa.dev-server.port=5173
quarkus.quinoa.dev-server.index-page=/

quarkus.rest-client.streamelements.url=https://api.streamelements.com
quarkus.rest-client.streamelements.user-agent=dankchat-server
quarkus.rest-client.twitch-helix.url=https://api.twitch.tv
quarkus.cache.caffeine."chat-colors".expire-after-write=10M
quarkus.cache.caffeine."chat-colors".maximum-size=1000
%test.quarkus.cache.enabled=false

quarkus.oidc-client.twitch.auth-server-url=https://id.twitch.tv/oauth2
quarkus.oidc-client.twitch.discovery-enabled=false
quarkus.oidc-client.twitch.token-path=/token
quarkus.oidc-client.twitch.client-id=${TWITCH_CLIENT_ID:}
quarkus.oidc-client.twitch.credentials.client-secret.value=${TWITCH_CLIENT_SECRET:}
quarkus.oidc-client.twitch.credentials.client-secret.method=post
quarkus.oidc-client.twitch.grant.type=client
quarkus.oidc-client.twitch.early-tokens-acquisition=false
%test.quarkus.oidc-client.twitch.client-enabled=false

dankchat.streamelements.channel-id=5b144fc91a5cbe3a3a920871
dankchat.streamelements.token=${SE_TOKEN:}
dankchat.donation-poller.interval=5m
dankchat.donation-poller.delay=10s

%test.quarkus.scheduler.enabled=false
%test.dankchat.streamelements.token=test-token
